<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💰 记账 — 自定义键盘</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif; background:#E8EAF0; display:flex; justify-content:center; gap:20px; padding:20px; }
.phone { width:375px; height:812px; background:#F7F7FA; border-radius:40px; overflow:hidden; position:relative; box-shadow:0 12px 48px rgba(0,0,0,0.15), inset 0 0 0 2px #DDD; display:flex; flex-direction:column; }
.phone-label { text-align:center; font-size:13px; color:#6B7280; font-weight:600; margin-top:6px; }
.status-bar { height:44px; background:#FFF; display:flex; align-items:center; justify-content:space-between; padding:0 24px; font-size:12px; color:#333; flex-shrink:0; }
.content { flex:1; overflow:hidden; display:flex; flex-direction:column; }

/* 顶部 */
.top-bar { padding:12px 14px 6px; }
.ledger-info { display:inline-flex; align-items:center; gap:5px; background:#FFF; padding:6px 14px; border-radius:18px; font-size:12px; font-weight:600; box-shadow:0 1px 4px rgba(79,70,229,0.06); }
.ledger-arrow { font-size:9px; color:#9CA3AF; }

.type-switch { display:flex; background:#F3F4F6; border-radius:22px; padding:2px; margin:0 14px 10px; }
.type-btn { flex:1; text-align:center; padding:8px 0; border-radius:22px; font-size:13px; font-weight:600; color:#9CA3AF; }
.type-btn.expense { background:linear-gradient(135deg,#EF4444,#F87171); color:#FFF; }

/* 输入区 */
.input-area { background:#FFF; margin:0 10px 8px; border-radius:16px; padding:14px 16px; box-shadow:0 1px 8px rgba(79,70,229,0.05); }
.amount-row { display:flex; align-items:center; padding-bottom:10px; border-bottom:1px solid #F3F4F6; }
.category-badge { display:flex; align-items:center; gap:4px; background:#EEF2FF; padding:5px 12px; border-radius:20px; margin-right:12px; flex-shrink:0; }
.category-badge-icon { font-size:16px; }
.category-badge-name { font-size:12px; font-weight:600; color:#4F46E5; }
.category-badge-arrow { font-size:8px; color:#6366F1; }
.amount-display { flex:1; display:flex; align-items:baseline; justify-content:flex-end; min-height:36px; }
.amount-symbol { font-size:20px; font-weight:700; color:#1F2937; margin-right:4px; }
.amount-value { font-size:36px; font-weight:700; color:#1F2937; font-variant-numeric:tabular-nums; }
.cursor { width:2px; height:28px; background:#4F46E5; animation:blink 1s infinite; margin-left:2px; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
.note-row { padding:8px 0; }
.note-input { font-size:13px; color:#374151; border:none; outline:none; width:100%; }
.note-input::placeholder { color:#9CA3AF; }

.quick-options { display:flex; gap:6px; padding-top:10px; border-top:1px solid #F3F4F6; }
.quick-opt { display:flex; align-items:center; gap:3px; background:#F9FAFB; padding:4px 10px; border-radius:14px; }
.quick-opt-icon { font-size:12px; }
.quick-opt-text { font-size:11px; color:#6B7280; }

/* 键盘 */
.keyboard { margin-top:auto; background:#E5E7EB; border-top:2px solid #EF4444; padding-bottom:20px; }
.quick-amounts { display:flex; padding:8px 8px 4px; gap:4px; }
.quick-amount { flex:1; text-align:center; padding:6px 0; background:#FFF; border-radius:8px; font-size:12px; font-weight:600; color:#4F46E5; box-shadow:0 1px 2px rgba(0,0,0,0.05); }
.keypad { display:grid; grid-template-columns:repeat(4,1fr); gap:3px; padding:4px 6px 6px; }
.key { display:flex; align-items:center; justify-content:center; background:#FFF; border-radius:8px; height:44px; font-size:20px; font-weight:500; color:#1F2937; box-shadow:0 1px 2px rgba(0,0,0,0.05); }
.key-del { font-size:18px; color:#6B7280; }
.key-ok { background:linear-gradient(135deg,#EF4444,#F87171); color:#FFF; font-size:14px; font-weight:700; }
</style>
</head>
<body>

<div>
<div class="phone">
  <div class="status-bar"><span>12:30</span><span>⚡️ 100%</span></div>
  <div class="content">
    <div class="top-bar">
      <div class="ledger-info">📒 我的账本 <span class="ledger-arrow">▼</span></div>
    </div>
    <div class="type-switch"><div class="type-btn expense">支出</div><div class="type-btn">收入</div></div>

    <div class="input-area">
      <div class="amount-row">
        <div class="category-badge">
          <span class="category-badge-icon">🍜</span>
          <span class="category-badge-name">餐饮</span>
          <span class="category-badge-arrow">▼</span>
        </div>
        <div class="amount-display">
          <span class="amount-symbol">¥</span>
          <span class="amount-value">35</span>
          <span class="cursor"></span>
        </div>
      </div>
      <div class="note-row">
        <input class="note-input" placeholder="添加备注..." value="午餐 · 黄焖鸡" />
      </div>
      <div class="quick-options">
        <div class="quick-opt"><span class="quick-opt-icon">👤</span><span class="quick-opt-text">我</span></div>
        <div class="quick-opt"><span class="quick-opt-icon">📅</span><span class="quick-opt-text">今天</span></div>
        <div class="quick-opt"><span class="quick-opt-icon">💳</span><span class="quick-opt-text">微信支付</span></div>
        <div class="quick-opt"><span class="quick-opt-icon">⚖️</span><span class="quick-opt-text">分摊</span></div>
      </div>
    </div>

    <div class="keyboard">
      <div class="quick-amounts">
        <div class="quick-amount">5</div>
        <div class="quick-amount">10</div>
        <div class="quick-amount">20</div>
        <div class="quick-amount">50</div>
        <div class="quick-amount">100</div>
        <div class="quick-amount">200</div>
      </div>
      <div class="keypad">
        <div class="key">1</div><div class="key">2</div><div class="key">3</div><div class="key key-del">⌫</div>
        <div class="key">4</div><div class="key">5</div><div class="key">6</div><div class="key key-ok">确认</div>
        <div class="key">7</div><div class="key">8</div><div class="key">9</div><div class="key key-ok">确认</div>
        <div class="key">.</div><div class="key">0</div><div class="key">00</div><div class="key key-ok">确认</div>
      </div>
    </div>
  </div>
</div>
<div class="phone-label">📝 自定义键盘记账</div>
</div>

</body>
</html>
